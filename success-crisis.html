<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Отлично! Всё получилось</title>
<style>
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Black.ttf') format('truetype');font-weight:900;font-style:normal;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:'CoFo Avito Text',Arial,sans-serif}button{font:inherit;color:inherit}body{padding-bottom:104px}.page{width:100%;max-width:520px;margin:auto}
.status-spacer{height:53px}
main{padding:0 16px}
.illustration{display:block;width:100%;max-width:349px;margin:0 auto}
.title{margin:12px 0 0;font-size:32px;line-height:36px;font-weight:800;text-align:center}
.notice{display:flex;align-items:flex-start;gap:4px;margin-top:10px;padding:6px 0}
.notice img{width:16px;height:20px;flex-shrink:0;margin-top:1px}
.notice p{margin:0;font-size:15px;line-height:20px}
.notice .link{color:#757575;text-decoration:underline}
.next-title{margin:28px 0 0;font-size:21px;line-height:26px;font-weight:800}
.next-scroll{margin-top:16px;display:flex;gap:6px;overflow-x:auto;padding:0 16px 4px;margin-left:-16px;margin-right:-16px;scrollbar-width:none}
.next-scroll::-webkit-scrollbar{display:none}
.next-card{flex-shrink:0;width:136px;padding:12px 12px 16px;border-radius:20px;background:#f2f1f0}
.next-card img{width:48px;height:48px;display:block;border-radius:14px}
.next-card p{margin:16px 0 0;font-size:15px;line-height:20px;font-weight:500}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px;border-radius:24px 24px 0 0;background:#fff;transition:box-shadow .2s}
.footer.has-shadow{box-shadow:0 -1px 3px rgba(0,0,0,.05),0 -4px 30px rgba(0,0,0,.12)}
.footer-inner{max-width:520px;margin:0 auto}
.continue{width:100%;min-height:52px;border:0;border-radius:16px;background:#141414;color:#fff;font-size:15px;line-height:20px;cursor:pointer}
</style>
</head>
<body>
<div class="page">
<div class="status-spacer"></div>
<main>
<img class="illustration" src="new-podaca-V3/success/checkmark-illustration.png" alt="">
<h1 class="title">Отлично!<br>Всё получилось</h1>
<div class="notice"><img src="new-podaca-V3/success/checkmark-small.svg" alt=""><p>Вещи на благотворительность опубликуются после проверки. После этого фонды увидят объявление</p></div>
<h2 class="next-title">Что будет дальше</h2>
<div class="next-scroll">
<div class="next-card"><img src="new-podaca-V3/success/icon-chat.png" alt=""><p>Фонд напишет в чате</p></div>
<div class="next-card"><img src="new-podaca-V3/success/icon-deal.png" alt=""><p>Обсудите детали</p></div>
<div class="next-card"><img src="new-podaca-V3/success/icon-send.png" alt=""><p>Отправьте вещи</p></div>
</div>
</main>
</div>
<div class="footer"><div class="footer-inner"><button class="continue" onclick="finish()">Мои объявления</button></div></div>
<script>
function finish(){
  sessionStorage.setItem('hasPublishedCharityAd','1');
  var keysToRemove=['userPickedFund','initialPackCategories','charityRecommendedCatsByFund','catSelections','catDraft','mainCategory','adCollection','prevPage','catPhotoEditId','catPhotoEditTakenPhotos','photoReturnPage','viewFundId','fundInfoReturn','charityNeedSelections','mainDesc','adDesc','adPrice','adCategories','hasDraft','catPhotoEditDraft','catPhotoEditFromPack','step5crisis_scrollY','globalSelectedPhotos','listingFlowAutoFilled','listingFlowEntry','categoryDetailsCategory','categoryDetailsMode','pendingCategory','editingParcelCategory'];
  keysToRemove.forEach(function(k){sessionStorage.removeItem(k)});
  window.location.href='ads.html';
}
function updateFooterShadow(){var el=document.querySelector('.footer');if(!el)return;el.classList.toggle('has-shadow',document.documentElement.scrollHeight-(window.scrollY+window.innerHeight)>4)}
window.addEventListener('scroll',updateFooterShadow,{passive:true});
window.addEventListener('resize',updateFooterShadow);
window.addEventListener('load',updateFooterShadow);
updateFooterShadow();
</script>
</body></html>
