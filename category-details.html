<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Категория вещей</title>
<style>
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'CoFo Avito Text';src:url('fonts/CoFoAvitoText-Black.ttf') format('truetype');font-weight:900;font-style:normal;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:'CoFo Avito Text',Arial,sans-serif}button{font:inherit}body{padding-bottom:96px}.page{width:100%;max-width:520px;margin:auto}.header{height:64px;padding:8px 16px;display:flex;align-items:center;gap:8px}.back{width:40px;height:40px;flex-shrink:0;padding:0;border:0;background:none;cursor:pointer}.back img{width:40px;height:40px}.header-title{flex:1;text-align:center;margin:0 -48px;font-size:16px;line-height:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:8px 16px 24px}
.field{margin-top:16px}
.field-label{margin:0 0 12px;font-size:16px;line-height:20px;font-weight:700}
.field-label-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.field-label-row .field-label{margin:0;cursor:pointer}
.hint-btn{width:20px;height:20px;flex-shrink:0;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hint-btn img{width:15px;height:20px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:14px 16px;border:0;border-radius:16px;background:#f2f1f0;color:#111;font-size:15px;line-height:20px;cursor:pointer;transition:box-shadow .15s}
.chip.selected{background:#141414;color:#fff}
.field-error .chip{box-shadow:0 0 0 1.5px #ff4053 inset}
.checkbox-list{display:flex;flex-direction:column}
.sheet-content>.checkbox-list{margin-top:16px}
.checkbox-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding:0;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.checkbox-row:first-child{margin-top:0}
.checkbox-row img{width:20px;height:20px;flex-shrink:0;border-radius:6px;transition:box-shadow .15s}
.checkbox-row span{font-size:15px;line-height:20px}
.field-error .checkbox-row img{box-shadow:0 0 0 1.5px #ff4053}
.size-select{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 18px;border:0;border-radius:16px;background:#f2f1f0;color:#757575;font-size:15px;line-height:20px;text-align:left;cursor:pointer;transition:box-shadow .15s}
.size-select.has-value{color:#111}
.size-select img{width:12px;height:20px;flex-shrink:0}
.field-error .size-select{box-shadow:0 0 0 1.5px #ff4053 inset}
.photos-grid{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field-error.photos-grid .add-photo{box-shadow:0 0 0 1.5px #ff4053 inset}
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.sheet-overlay.open{opacity:1;visibility:visible;transition:opacity .25s ease}
.bottom-sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;min-width:320px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;overflow:hidden;display:flex;flex-direction:column;max-height:88vh;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet-overlay.open .bottom-sheet{transform:translateY(0)}
.sheet-close{position:absolute;top:14px;right:20px;width:20px;height:30px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
.sheet-close img{width:20px;height:28.57px}
.sheet-content{padding:16px 16px 0;overflow-y:auto}
.sheet-title{margin:0;padding-right:40px;font-size:26px;line-height:30px;font-weight:700}
.sheet-footer{padding:10px;box-shadow:0 -1px 3px rgba(0,0,0,.05),0 -4px 24px rgba(0,0,0,.12)}
.size-chart-card{padding:16px 0;border-bottom:1px solid #ebeae8}
.size-chart-card:last-child{border-bottom:0}
.size-chart-size{font-size:18px;line-height:22px;font-weight:700;margin-bottom:6px}
.size-chart-detail{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;color:#757575;padding:2px 0}
.size-chart-detail span:last-child{color:#111}
.photo-tile,.add-photo{position:relative;aspect-ratio:1;min-width:0;overflow:hidden;border:0;border-radius:16px;padding:0;cursor:pointer}
.photo-tile img.photo-img{width:100%;height:100%;object-fit:cover}
.photo-delete{position:absolute;right:8px;bottom:8px;width:44px;height:44px;padding:0;border:0;background:none}
.photo-delete img{width:44px;height:44px}
.add-photo{background:#f2f1f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:box-shadow .15s}
.add-photo img{width:32px;height:32px}
.add-photo span{font-size:15px;line-height:20px}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px;display:flex;gap:6px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -1px 3px rgba(0,0,0,.05),0 -4px 24px rgba(0,0,0,.12)}
.footer-inner{max-width:600px;margin:0 auto;width:100%;display:flex;gap:6px}
.btn{flex:1;min-height:52px;border:0;border-radius:16px;font-size:15px;line-height:20px;cursor:pointer}
.btn-primary{background:#141414;color:#fff}
.btn-secondary{background:#f2f1f0;color:#111}
.toast{position:fixed;left:16px;right:16px;bottom:80px;z-index:30;margin:0 auto;max-width:480px;padding:16px 20px;border-radius:28px;background:#ff4053;color:#fff;font-size:15px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05),0 4px 24px rgba(0,0,0,.12);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="page">
<header class="header"><button class="back" onclick="goBack()" aria-label="Назад"><img src="step 2 materials/back.svg" alt=""></button><h1 class="header-title" id="page-title"></h1><span style="width:40px"></span></header>
<main id="fields-root"></main>
</div>
<div class="footer"><div class="footer-inner" id="footer-buttons"></div></div>
<div class="toast" id="toast">Заполните данные категории</div>
<div class="sheet-overlay" id="size-pick-sheet" onclick="closeSizePickSheet(event)"><div class="bottom-sheet"><button class="sheet-close" onclick="closeSizePickSheet()" aria-label="Закрыть"><img src="new category/CloseButton.svg" alt=""></button><div class="sheet-content"><h2 class="sheet-title">Размер</h2><div class="checkbox-list" id="size-pick-list"></div></div><div class="sheet-footer"><button type="button" class="btn btn-primary" style="width:100%" onclick="confirmSizePick()">Выбрать</button></div></div></div>
<div class="sheet-overlay" id="size-chart-sheet" onclick="closeSizeChartSheet(event)"><div class="bottom-sheet"><button class="sheet-close" onclick="closeSizeChartSheet()" aria-label="Закрыть"><img src="new category/CloseButton.svg" alt=""></button><div class="sheet-content"><h2 class="sheet-title">Таблица размеров</h2><div id="size-chart-body"></div></div><div class="sheet-footer"><button type="button" class="btn btn-primary" style="width:100%" onclick="closeSizeChartSheet()">Понятно</button></div></div></div>
<script>
const PHOTO_FILES={1:'new podacha/fond 1 photo 1.png?v=2',2:'new podacha/fond 1 photo 2.png?v=2',3:'new podacha/fond 2 photo 1.png?v=2',4:'new podacha/fond 2 photo 2.png?v=2',5:'new podacha/fond 3 photo 1.png?v=2',6:'new podacha/fond 3 photo 2.png?v=2',7:'new podacha/fond 4 photo 1.png?v=2',8:'new podacha/fond 4 photo 2.png?v=2'};
const PHOTO_CATEGORIES={1:'Детская одежда',2:'Детская одежда',3:'Аксессуары',4:'Одежда',5:'Книги',6:'Книги',7:'Электроника',8:'Средства реабилитации'};

const PRESETS={
  clothingKids:[
    {key:'pol',type:'chips',label:'Пол',options:['Для мальчиков','Для девочек','Унисекс']},
    {key:'razmer',type:'size',label:'Размер',placeholder:'Выберите примерный размер вещей',options:['80–92','98–116','122–140','146–152'],sizeChart:[
      {size:'80–92',short:'1–2 года',details:[['Возраст','1–2 года'],['Рост, см','80–92'],['Обхват груди, см','51–53']]},
      {size:'98–116',short:'3–6 лет',details:[['Возраст','3–6 лет'],['Рост, см','98–116'],['Обхват груди, см','55–59']]},
      {size:'122–140',short:'7–10 лет',details:[['Возраст','7–10 лет'],['Рост, см','122–140'],['Обхват груди, см','63–68']]},
      {size:'146–152',short:'11–12 лет',details:[['Возраст','11–12 лет'],['Рост, см','146–152'],['Обхват груди, см','72–76']]}
    ]},
    {key:'sezon',type:'checkbox',label:'Сезон',options:['Зима','Весна–осень','Лето','Всесезонная']},
    {key:'sostoyanie',type:'chips',label:'Общее состояние вещей',options:['Новое с биркой','Отличное','Хорошее','Удовлетворительное']}
  ],
  clothingAdult:[
    {key:'pol',type:'chips',label:'Пол',options:['Для мужчин','Для женщин','Унисекс']},
    {key:'razmer',type:'size',label:'Размер',placeholder:'Выберите примерный размер вещей',options:['XS','S','M','L','XL','XXL'],sizeChart:[
      {size:'XS',short:'40–42',details:[['Российский размер','40–42'],['Обхват груди, см','82–85'],['Обхват талии, см','62–65'],['Обхват бёдер, см','88–91']]},
      {size:'S',short:'44–46',details:[['Российский размер','44–46'],['Обхват груди, см','88–92'],['Обхват талии, см','68–73'],['Обхват бёдер, см','94–98']]},
      {size:'M',short:'48–50',details:[['Российский размер','48–50'],['Обхват груди, см','96–100'],['Обхват талии, см','76–82'],['Обхват бёдер, см','100–104']]},
      {size:'L',short:'52–54',details:[['Российский размер','52–54'],['Обхват груди, см','104–108'],['Обхват талии, см','86–92'],['Обхват бёдер, см','108–112']]},
      {size:'XL',short:'56–58',details:[['Российский размер','56–58'],['Обхват груди, см','112–116'],['Обхват талии, см','96–102'],['Обхват бёдер, см','116–120']]},
      {size:'XXL',short:'60 и больше',details:[['Российский размер','60 и больше'],['Обхват груди, см','120 и больше'],['Обхват талии, см','106 и больше'],['Обхват бёдер, см','124 и больше']]}
    ]},
    {key:'sezon',type:'checkbox',label:'Сезон',options:['Зима','Весна–осень','Лето','Всесезонная']},
    {key:'sostoyanie',type:'chips',label:'Общее состояние вещей',options:['Новое с биркой','Отличное','Хорошее','Удовлетворительное']}
  ],
  footwear:[
    {key:'pol',type:'chips',label:'Пол',options:['Для мужчин','Для женщин','Унисекс']},
    {key:'razmer',type:'size',label:'Размер',placeholder:'Выберите примерный размер обуви',options:['36–37','38–39','40–41','42–43','44+'],sizeChart:[
      {size:'36–37',short:'23–23,5 см',details:[['Длина стопы, см','23–23,5'],['US','6–6,5'],['UK','3,5–4']]},
      {size:'38–39',short:'24–25 см',details:[['Длина стопы, см','24–25'],['US','7–8'],['UK','4,5–5,5']]},
      {size:'40–41',short:'25,5–26,5 см',details:[['Длина стопы, см','25,5–26,5'],['US','8,5–9,5'],['UK','6–7']]},
      {size:'42–43',short:'27–28 см',details:[['Длина стопы, см','27–28'],['US','10–11'],['UK','7,5–8,5']]},
      {size:'44+',short:'28,5 см и больше',details:[['Длина стопы, см','28,5 и больше'],['US','11,5 и больше'],['UK','9 и больше']]}
    ]},
    {key:'sezon',type:'checkbox',label:'Сезон',options:['Зима','Демисезон','Лето']},
    {key:'sostoyanie',type:'chips',label:'Общее состояние вещей',options:['Новое','Отличное','Хорошее','Удовлетворительное']}
  ],
  bedding:[
    {key:'razmer',type:'size',label:'Размер',placeholder:'Выберите примерный размер',options:['1,5-спальное','2-спальное','Евро','Другое'],sizeChart:[
      {size:'1,5-спальное',short:'150×200 см',details:[['Простыня, см','150×214'],['Пододеяльник, см','145×210'],['Наволочки, см','50×70, 2 шт']]},
      {size:'2-спальное',short:'180×200 см',details:[['Простыня, см','180×214'],['Пододеяльник, см','175×210'],['Наволочки, см','50×70, 2 шт']]},
      {size:'Евро',short:'200×220 см',details:[['Простыня, см','220×240'],['Пододеяльник, см','200×220'],['Наволочки, см','50×70, 2 шт']]},
      {size:'Другое',short:'нестандартный размер',details:[['Комплектность','уточняется в описании']]}
    ]},
    {key:'sostoyanie',type:'chips',label:'Общее состояние вещей',options:['Новое','Отличное','Хорошее','Удовлетворительное']}
  ],
  dishes:[
    {key:'tip',type:'chips',label:'Тип посуды',options:['Тарелки','Кружки','Столовые приборы','Наборы']},
    {key:'sostoyanie',type:'chips',label:'Общее состояние вещей',options:['Новое','Отличное','Хорошее','Удовлетворительное']}
  ],
  hygiene:[
    {key:'tip',type:'chips',label:'Тип средств',options:['Мыло и гели','Шампуни','Зубные щётки и паста','Прочее']},
    {key:'sostoyanie',type:'chips',label:'Состояние упаковки',options:['Новое, в упаковке','Начатое']}
  ],
  booksChild:[
    {key:'vozrast',type:'chips',label:'Возраст читателя',options:['0–3 года','4–7 лет','8–12 лет']},
    {key:'sostoyanie',type:'chips',label:'Общее состояние',options:['Как новая','Хорошее','Есть потертости']}
  ],
  booksGeneric:[
    {key:'sostoyanie',type:'chips',label:'Общее состояние',options:['Как новая','Хорошее','Есть потертости']}
  ],
  rehab:[
    {key:'tip',type:'chips',label:'Тип изделия',options:['Трости','Ходунки','Инвалидные коляски','Прочее']},
    {key:'sostoyanie',type:'chips',label:'Состояние',options:['Рабочее состояние','Требует мелкого ремонта']}
  ]
};
const CATEGORY_PRESET={'Детская одежда':'clothingKids','Тёплая одежда':'clothingAdult','Одежда для взрослых':'clothingAdult','Тёплые вещи':'clothingAdult','Обувь для взрослых':'footwear','Обувь':'footwear','Одеяла':'bedding','Постельное бельё':'bedding','Посуда':'dishes','Средства гигиены':'hygiene','Детская литература':'booksChild','Художественная литература':'booksGeneric','Учебная литература':'booksGeneric','Энциклопедии':'booksGeneric','Средства реабилитации':'rehab'};
function fieldsFor(category){return PRESETS[CATEGORY_PRESET[category]]||PRESETS.booksGeneric}

function photoCategoryOverrides(){return JSON.parse(sessionStorage.getItem('photoCategoryOverrides')||'{}')}
function categoryOfPhoto(id,overrides){return overrides[id]||PHOTO_CATEGORIES[id]||'Вещи'}

let category=sessionStorage.getItem('categoryDetailsCategory');
let mode=sessionStorage.getItem('categoryDetailsMode');
if(!category){
  const editing=sessionStorage.getItem('editingParcelCategory');
  const adding=sessionStorage.getItem('pendingCategory');
  category=editing||adding;
  mode=editing?'edit':'add';
  if(category){sessionStorage.setItem('categoryDetailsCategory',category);sessionStorage.setItem('categoryDetailsMode',mode)}
}
sessionStorage.removeItem('editingParcelCategory');
sessionStorage.removeItem('pendingCategory');
if(!category){history.back()}

let allPhotos=JSON.parse(sessionStorage.getItem('selectedPhotos')||'[]').map(Number);
let overrides=photoCategoryOverrides();
let photos=allPhotos.filter(id=>categoryOfPhoto(id,overrides)===category);

if(sessionStorage.getItem('catPhotoEditId')){
  const own=JSON.parse(sessionStorage.getItem('selectedPhotos')||'[]').map(Number);
  const taken=JSON.parse(sessionStorage.getItem('catPhotoEditTakenPhotos')||'[]').map(Number);
  allPhotos=[...taken,...own];
  sessionStorage.setItem('selectedPhotos',JSON.stringify(allPhotos));
  overrides=photoCategoryOverrides();
  own.forEach(id=>{overrides[id]=category});
  sessionStorage.setItem('photoCategoryOverrides',JSON.stringify(overrides));
  sessionStorage.removeItem('catPhotoEditId');
  sessionStorage.removeItem('catPhotoEditTakenPhotos');
  photos=allPhotos.filter(id=>categoryOfPhoto(id,overrides)===category);
}

const savedValues=JSON.parse(sessionStorage.getItem('categoryFieldData_'+category)||'{}');
const values={};
fieldsFor(category).forEach(f=>{
  let v=savedValues[f.key];
  if(f.type==='checkbox'||f.type==='size'){
    if(v==null)v=[];
    else if(!Array.isArray(v))v=[v];
  }else if(Array.isArray(v)){
    v=v[0]||null;
  }
  values[f.key]=v==null?(f.type==='checkbox'||f.type==='size'?[]:null):v;
});

document.getElementById('page-title').textContent=category;

function renderChips(field){
  const wrap=document.createElement('div');wrap.className='chips-wrap';
  field.options.forEach(opt=>{
    const btn=document.createElement('button');btn.type='button';btn.className='chip'+(values[field.key]===opt?' selected':'');btn.textContent=opt;
    btn.onclick=()=>{values[field.key]=(values[field.key]===opt?null:opt);renderFields()};
    wrap.appendChild(btn);
  });
  return wrap;
}
function renderSizeSelect(field){
  const chosen=values[field.key];
  const btn=document.createElement('button');btn.type='button';btn.className='size-select'+(chosen.length?' has-value':'');
  btn.innerHTML=`<span>${chosen.length?chosen.join(', '):field.placeholder}</span><img src="arrow down.svg" alt="">`;
  btn.onclick=()=>openSizePickSheet(field);
  return btn;
}
function renderCheckboxes(field){
  const wrap=document.createElement('div');wrap.className='checkbox-list';
  field.options.forEach(opt=>{
    const row=document.createElement('button');row.type='button';row.className='checkbox-row';
    const checked=values[field.key].includes(opt);
    row.innerHTML=`<img src="step 6 materials/checkbox ${checked?'on':'off'}.png" alt=""><span>${opt}</span>`;
    row.onclick=()=>{const arr=values[field.key];const i=arr.indexOf(opt);if(i>-1)arr.splice(i,1);else arr.push(opt);renderFields()};
    wrap.appendChild(row);
  });
  return wrap;
}
function renderPhotos(){
  const wrap=document.createElement('div');wrap.className='photos-grid';wrap.id='photos-field';
  photos.forEach(id=>{
    const tile=document.createElement('div');tile.className='photo-tile';
    tile.innerHTML=`<img class="photo-img" src="${PHOTO_FILES[id]}" alt=""><button type="button" class="photo-delete" aria-label="Удалить"><img src="step 2 materials/delete.svg" alt=""></button>`;
    tile.querySelector('.photo-delete').onclick=()=>{photos=photos.filter(p=>p!==id);renderFields()};
    wrap.appendChild(tile);
  });
  const add=document.createElement('button');add.type='button';add.className='add-photo';add.innerHTML='<img src="step 2 materials/Camera.svg" alt=""><span>Добавить</span>';add.onclick=addPhotos;
  wrap.appendChild(add);
  return wrap;
}
function renderFields(){
  const root=document.getElementById('fields-root');
  root.innerHTML='';
  fieldsFor(category).forEach(f=>{
    const box=document.createElement('div');box.className='field';box.dataset.key=f.key;
    if(f.type==='size'&&f.sizeChart){
      const row=document.createElement('div');row.className='field-label-row';
      const label=document.createElement('p');label.className='field-label';label.textContent=f.label;label.onclick=()=>openSizeChartSheet(f);
      const hint=document.createElement('button');hint.type='button';hint.className='hint-btn';hint.setAttribute('aria-label','Таблица размеров');hint.innerHTML='<img src="new-podaca-V3/QuestionFilled.svg" alt="">';hint.onclick=()=>openSizeChartSheet(f);
      row.appendChild(label);row.appendChild(hint);
      box.appendChild(row);
    }else{
      const label=document.createElement('p');label.className='field-label';label.textContent=f.label;
      box.appendChild(label);
    }
    if(f.type==='chips')box.appendChild(renderChips(f));
    else if(f.type==='checkbox')box.appendChild(renderCheckboxes(f));
    else if(f.type==='size')box.appendChild(renderSizeSelect(f));
    root.appendChild(box);
  });
  const photoLabel=document.createElement('div');photoLabel.className='field';
  photoLabel.innerHTML='<p class="field-label">Фотографии</p>';
  root.appendChild(photoLabel);
  root.appendChild(renderPhotos());
  renderFooter();
}
function renderFooter(){
  const el=document.getElementById('footer-buttons');
  el.innerHTML=mode==='edit'
    ?'<button type="button" class="btn btn-primary" onclick="save()">Сохранить</button><button type="button" class="btn btn-secondary" onclick="removeFromParcel()">Убрать из посылки</button>'
    :'<button type="button" class="btn btn-primary" onclick="save()">Сохранить</button>';
}
let sizePickField=null;
let sizePickValues=[];
function shortFor(field,opt){const e=(field.sizeChart||[]).find(s=>s.size===opt);return e?e.short:''}
function renderSizePickList(){
  const list=document.getElementById('size-pick-list');
  list.innerHTML='';
  sizePickField.options.forEach(opt=>{
    const row=document.createElement('button');row.type='button';row.className='checkbox-row';
    const checked=sizePickValues.includes(opt);
    const short=shortFor(sizePickField,opt);
    row.innerHTML=`<img src="step 6 materials/checkbox ${checked?'on':'off'}.png" alt=""><span>${short?`${opt}, ${short}`:opt}</span>`;
    row.onclick=()=>{const i=sizePickValues.indexOf(opt);if(i>-1)sizePickValues.splice(i,1);else sizePickValues.push(opt);renderSizePickList()};
    list.appendChild(row);
  });
}
function openSizePickSheet(field){
  sizePickField=field;sizePickValues=[...values[field.key]];
  renderSizePickList();
  document.getElementById('size-pick-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSizePickSheet(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('size-pick-sheet').classList.remove('open');document.body.style.overflow=''}
function confirmSizePick(){values[sizePickField.key]=sizePickValues;closeSizePickSheet();renderFields()}
function openSizeChartSheet(field){
  document.getElementById('size-chart-body').innerHTML=(field.sizeChart||[]).map(r=>`<div class="size-chart-card"><div class="size-chart-size">${r.size}</div>${(r.details||[]).map(([k,v])=>`<div class="size-chart-detail"><span>${k}</span><span>${v}</span></div>`).join('')}</div>`).join('');
  document.getElementById('size-chart-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSizeChartSheet(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('size-chart-sheet').classList.remove('open');document.body.style.overflow=''}
function addPhotos(){
  const own=photos;
  const others=allPhotos.filter(id=>!own.includes(id));
  sessionStorage.setItem('categoryFieldData_'+category,JSON.stringify(values));
  sessionStorage.setItem('catPhotoEditId',category);
  sessionStorage.setItem('selectedPhotos',JSON.stringify(own));
  sessionStorage.setItem('catPhotoEditTakenPhotos',JSON.stringify(others));
  sessionStorage.setItem('photoReturnPage','category-details.html');
  location.replace('step2-choose.html');
}
function validate(){
  let ok=true;let firstInvalid=null;
  fieldsFor(category).forEach(f=>{
    const val=values[f.key];
    const valid=(f.type==='checkbox'||f.type==='size')?val.length>0:!!val;
    const box=document.querySelector(`.field[data-key="${f.key}"]`);
    box.classList.toggle('field-error',!valid);
    if(!valid){ok=false;firstInvalid=firstInvalid||box}
  });
  const photosBox=document.getElementById('photos-field');
  const photosValid=photos.length>0;
  photosBox.classList.toggle('field-error',!photosValid);
  if(!photosValid){ok=false;firstInvalid=firstInvalid||photosBox}
  if(!ok){showToast();firstInvalid.scrollIntoView({behavior:'smooth',block:'center'})}
  return ok;
}
let toastTimer=null;
function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function persistParcel(){
  const others=allPhotos.filter(id=>categoryOfPhoto(id,overrides)!==category);
  const merged=[...others,...photos];
  overrides=photoCategoryOverrides();
  photos.forEach(id=>{overrides[id]=category});
  sessionStorage.setItem('selectedPhotos',JSON.stringify(merged));
  sessionStorage.setItem('photoCategoryOverrides',JSON.stringify(overrides));
}
function save(){
  if(!validate())return;
  sessionStorage.setItem('categoryFieldData_'+category,JSON.stringify(values));
  persistParcel();
  sessionStorage.removeItem('categoryDetailsCategory');
  sessionStorage.removeItem('categoryDetailsMode');
  history.back();
}
function removeFromParcel(){
  const others=allPhotos.filter(id=>categoryOfPhoto(id,overrides)!==category);
  overrides=photoCategoryOverrides();
  photos.forEach(id=>{delete overrides[id]});
  sessionStorage.setItem('selectedPhotos',JSON.stringify(others));
  sessionStorage.setItem('photoCategoryOverrides',JSON.stringify(overrides));
  sessionStorage.removeItem('categoryFieldData_'+category);
  sessionStorage.removeItem('categoryDetailsCategory');
  sessionStorage.removeItem('categoryDetailsMode');
  history.back();
}
function goBack(){
  if(mode==='add')sessionStorage.removeItem('categoryFieldData_'+category);
  sessionStorage.removeItem('categoryDetailsCategory');
  sessionStorage.removeItem('categoryDetailsMode');
  history.back();
}
renderFields();
</script>
</body></html>
